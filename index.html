<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&mdash;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#14110B;
  --ink:#ECE2CE;
  --ink2:#B9AE97;
  --ink3:#847A67;
  --rule:#332C1E;
  --cinnabar:#CB4632;
  --serif:'Spectral',Georgia,serif;
  --display:'Cormorant Garamond',Georgia,serif;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--serif);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem 1.6rem;
  overflow-x:hidden;
}

/* ── the line ── */
.plate{max-width:620px;width:100%;text-align:center}

.line{
  font-family:var(--display);
  font-weight:500;
  color:var(--ink);
}
.cl{
  display:block;
  font-size:clamp(30px,7.6vw,40px);
  line-height:1.30;
  letter-spacing:0.014em;
  opacity:0;
  transform:translateY(14px);
  animation:settle 1.5s cubic-bezier(.22,.61,.36,1) forwards;
}
.cl.q{
  font-size:clamp(20px,4.6vw,25px);
  font-style:italic;
  color:var(--ink2);
  line-height:1.5;
  margin:.10em 0 .22em;
}
.cl:nth-child(1){animation-delay:.10s}
.cl:nth-child(2){animation-delay:.45s}
.cl:nth-child(3){animation-delay:.80s}
.cl:nth-child(4){animation-delay:1.15s}
.cl:nth-child(5){animation-delay:1.50s}
@keyframes settle{to{opacity:1;transform:none}}

/* doors — indistinguishable until touched */
.door{
  color:inherit;text-decoration:none;cursor:pointer;
  position:relative;
  transition:color .5s ease;
}
.door::after{
  content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;
  background:var(--cinnabar);transition:right .55s cubic-bezier(.22,.61,.36,1);
}
.door:hover{color:var(--cinnabar)}
.door:hover::after{right:0}

/* ── the seam: tap target on the final stop ── */
.seam{
  cursor:pointer;color:inherit;
  padding:.35em .45em;margin:-.35em -.35em;
  transition:color .6s ease,text-shadow .6s ease;
}
.seam:hover{color:var(--cinnabar)}
body.open .seam{color:var(--cinnabar);text-shadow:0 0 14px rgba(203,70,50,.45)}

/* ── revealed ── */
.veil{
  margin-top:0;max-height:0;opacity:0;overflow:hidden;
  transition:max-height 1.15s cubic-bezier(.22,.61,.36,1), opacity .95s ease .18s, margin-top 1.15s cubic-bezier(.22,.61,.36,1);
}
body.open .veil{max-height:340px;opacity:1;margin-top:2.5rem}

.rule{
  height:1px;background:var(--cinnabar);opacity:.5;
  width:0;margin:0 auto 1.6rem;
  transition:width 1.3s cubic-bezier(.22,.61,.36,1) .25s;
}
body.open .rule{width:100%}

.entry{
  display:block;text-decoration:none;color:var(--ink2);
  padding:.72rem 0;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:.9rem;
  opacity:0;transform:translateY(9px);
  transition:opacity .8s ease, transform .8s cubic-bezier(.22,.61,.36,1), color .3s ease, border-color .3s ease;
  text-align:left;
}
body.open .entry{opacity:1;transform:none}
body.open .entry:nth-of-type(1){transition-delay:.42s}
body.open .entry:nth-of-type(2){transition-delay:.56s}
.entry:last-of-type{border-bottom:none}
.entry:hover{color:var(--ink);border-color:var(--cinnabar)}
.entry .n{font-family:var(--display);font-size:20px;font-weight:500;flex:1}
.entry .g{font-style:italic;font-size:12.5px;color:var(--ink3);letter-spacing:.01em}
.entry:hover .g{color:var(--ink2)}

/* ── date, quiet at the foot ── */
.foot{
  position:fixed;bottom:1.5rem;left:0;right:0;text-align:center;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);opacity:.5;
  transition:opacity .8s ease,color .8s ease;
  pointer-events:none;
}
body.open .foot{opacity:.85;color:var(--ink2)}

@media(max-width:520px){
  body{padding:2rem 1.3rem}
  .cl{line-height:1.34;margin-bottom:.16em}
  .entry .n{font-size:19px}
  .entry{padding:.85rem 0}
  body.open .veil{margin-top:2.2rem}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .cl{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="plate">

  <!-- ── THE LINE ──────────────────────────────────────────────
       Two words are doors. Everything else is plain text.
         .door → data-go="iching.html"   (currently: consulted)
         .door → data-go="calendar.html" (currently: counted)
       To change the wording, keep the two <a class="door"> spans
       around whichever words should lead where.
  ────────────────────────────────────────────────────────────── -->
  <div class="line">
    <span class="cl">Time is <a class="door" data-go="calendar.html">counted</a></span>
    <span class="cl q">what is spent does not return</span>
    <span class="cl">change is <a class="door" data-go="iching.html">consulted</a></span>
    <span class="cl q">the answer is not the outcome</span>
    <span class="cl">the rest is fog<span class="seam" id="seam">.</span></span>
  </div>

  <div class="veil" id="veil">
    <div class="rule"></div>
    <a class="entry" href="iching.html">
      <span class="n">Changes</span>
      <span class="g">the sixty-four</span>
    </a>
    <a class="entry" href="calendar.html">
      <span class="n">Calendar</span>
      <span class="g">printable, by month</span>
    </a>
  </div>

</div>

<div class="foot" id="foot">&mdash;</div>

<script>
"use strict";
document.querySelectorAll(".door").forEach(function(d){
  d.addEventListener("click",function(){ location.href = d.dataset.go; });
});

var seam = document.getElementById("seam");
seam.addEventListener("click", function(){
  document.body.classList.toggle("open");
});

// quiet date at the foot
(function(){
  var d = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("foot").textContent =
    days[d.getDay()] + " \u00b7 " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
})();
</script>
</body>
</html>
