<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&mdash;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#14110B;
  --ink:#ECE2CE;
  --ink2:#B9AE97;
  --ink3:#847A67;
  --rule:#332C1E;
  --cinnabar:#CB4632;
  --serif:'Spectral',Georgia,serif;
  --display:'Cormorant Garamond',Georgia,serif;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--serif);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem 1.6rem;
  overflow-x:hidden;
}

/* ── the line ── */
.plate{max-width:620px;width:100%;text-align:center}

.line{
  font-family:var(--display);
  font-weight:500;
  color:var(--ink);
}
.cl{
  display:block;
  font-size:clamp(30px,7.6vw,40px);
  line-height:1.30;
  letter-spacing:0.014em;
  opacity:0;
  transform:translateY(14px);
  animation:settle 1.5s cubic-bezier(.22,.61,.36,1) forwards;
}
.cl.q{
  font-size:clamp(20px,4.6vw,25px);
  font-style:italic;
  color:var(--ink2);
  line-height:1.5;
  margin:.10em 0 .22em;
}
.cl:nth-child(1){animation-delay:.10s}
.cl:nth-child(2){animation-delay:.45s}
.cl:nth-child(3){animation-delay:.80s}
.cl:nth-child(4){animation-delay:1.15s}
.cl:nth-child(5){animation-delay:1.50s}
@keyframes settle{to{opacity:1;transform:none}}

/* doors — indistinguishable until touched */
.door{
  color:inherit;text-decoration:none;cursor:pointer;
  position:relative;
  transition:color .5s ease;
}
.door::after{
  content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;
  background:var(--cinnabar);transition:right .55s cubic-bezier(.22,.61,.36,1);
}
.door:hover{color:var(--cinnabar)}
.door:hover::after{right:0}

/* ── the seam: tap target on the final stop ── */
.seam{
  cursor:pointer;color:inherit;
  padding:.35em .45em;margin:-.35em -.35em;
  transition:color .6s ease,text-shadow .6s ease;
}
.seam:hover{color:var(--cinnabar)}
body.open .seam{color:var(--cinnabar);text-shadow:0 0 14px rgba(203,70,50,.45)}

/* ── revealed ── */
.veil{
  margin-top:0;max-height:0;opacity:0;overflow:hidden;
  transition:max-height 1.15s cubic-bezier(.22,.61,.36,1), opacity .95s ease .18s, margin-top 1.15s cubic-bezier(.22,.61,.36,1);
}
body.open .veil{max-height:340px;opacity:1;margin-top:2.5rem}

.rule{
  height:1px;background:var(--cinnabar);opacity:.5;
  width:0;margin:0 auto 1.6rem;
  transition:width 1.3s cubic-bezier(.22,.61,.36,1) .25s;
}
body.open .rule{width:100%}

.entry{
  display:block;text-decoration:none;color:var(--ink2);
  padding:.72rem 0;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:.9rem;
  opacity:0;transform:translateY(9px);
  transition:opacity .8s ease, transform .8s cubic-bezier(.22,.61,.36,1), color .3s ease, border-color .3s ease;
  text-align:left;
}
body.open .entry{opacity:1;transform:none}
body.open .entry:nth-of-type(1){transition-delay:.42s}
body.open .entry:nth-of-type(2){transition-delay:.56s}
.entry:last-of-type{border-bottom:none}
.entry:hover{color:var(--ink);border-color:var(--cinnabar)}
.entry .n{font-family:var(--display);font-size:20px;font-weight:500;flex:1}
.entry .g{font-style:italic;font-size:12.5px;color:var(--ink3);letter-spacing:.01em}
.entry:hover .g{color:var(--ink2)}

/* ── date, quiet at the foot ── */
.foot{
  position:fixed;bottom:1.5rem;left:0;right:0;text-align:center;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);opacity:.5;
  transition:opacity .8s ease,color .8s ease;
  pointer-events:none;
}
body.open .foot{opacity:.85;color:var(--ink2)}


/* ══ DEPARTURE ══
   beat 1  held breath   — 420ms, nothing moves
   beat 2  the word wakes — chosen door brightens, rule completes, glow
   beat 3  the drain      — everything else desaturates and recedes; the word holds, then goes
*/
body.leaving{pointer-events:none}

/* everything that is not the chosen word */
body.leaving .cl{ animation:none !important }   /* release the entrance animation's hold */
body.leaving .cl,
body.leaving .foot,
body.leaving .veil{
  transition:opacity 620ms cubic-bezier(.4,0,.6,1), filter 620ms cubic-bezier(.4,0,.6,1), transform 900ms cubic-bezier(.32,0,.24,1);
}
body.drain .cl{ opacity:0; filter:saturate(0) blur(2.5px); transform:translateY(-8px) }
body.drain .foot{ opacity:0 }
body.drain .veil{ opacity:0 }

/* the chosen word is lifted onto its own layer so the drain cannot touch it */
#ghost{
  position:fixed; z-index:5; margin:0; padding:0;
  font-family:var(--display); font-weight:500;
  color:var(--cinnabar);
  pointer-events:none; opacity:0;
  text-shadow:0 0 0 rgba(203,70,50,0);
  transition:opacity 420ms ease, text-shadow 900ms ease, transform 1500ms cubic-bezier(.32,0,.24,1);
}
#ghost.on{ opacity:1 }
#ghost.glow{ text-shadow:0 0 26px rgba(203,70,50,.55), 0 0 60px rgba(203,70,50,.22) }
#ghost.out{
  opacity:0; transform:translateY(-4px);
  text-shadow:0 0 70px rgba(203,70,50,0);
  transition:opacity 620ms cubic-bezier(.5,0,.75,0), text-shadow 620ms ease, transform 620ms ease;
}
#ghost::after{
  content:""; position:absolute; left:0; right:100%; bottom:-2px; height:1px;
  background:var(--cinnabar); transition:right 520ms cubic-bezier(.22,.61,.36,1);
}
#ghost.on::after{ right:0 }
#ghost.out::after{ right:100%; transition:right 480ms cubic-bezier(.5,0,.75,0) }

/* the door itself */
.door{ will-change:color }
body.leaving .door.chosen{ color:var(--cinnabar); transition:color 420ms ease }

/* the field itself deepens */
body{transition:background-color 1200ms ease}
body.drain{background:#0B0906}

/* a page arriving should not flash */
.plate{animation:arrive 900ms ease both}
@keyframes arrive{from{opacity:0}to{opacity:1}}

@media(prefers-reduced-motion:reduce){
  body.leaving *,body.drain *,body.vanish *{transition-duration:.01ms!important}
  .plate{animation:none}
}

@media(max-width:520px){
  body{padding:2rem 1.3rem}
  .cl{line-height:1.34;margin-bottom:.16em}
  .entry .n{font-size:19px}
  .entry{padding:.85rem 0}
  body.open .veil{margin-top:2.2rem}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .cl{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="plate">

  <!-- ── THE LINE ──────────────────────────────────────────────
       Two words are doors. Everything else is plain text.
         .door → data-go="iching.html"   (currently: consulted)
         .door → data-go="calendar.html" (currently: counted)
       To change the wording, keep the two <a class="door"> spans
       around whichever words should lead where.
  ────────────────────────────────────────────────────────────── -->
  <div class="line">
    <span class="cl">Time is <a class="door" data-go="calendar.html">counted</a></span>
    <span class="cl q">what is spent does not return</span>
    <span class="cl">change is <a class="door" data-go="iching.html">consulted</a></span>
    <span class="cl q">the answer is not the outcome</span>
    <span class="cl">the rest is fog<span class="seam" id="seam">.</span></span>
  </div>

  <div class="veil" id="veil">
    <div class="rule"></div>
    <a class="entry" href="iching.html">
      <span class="n">Changes</span>
      <span class="g">the sixty-four</span>
    </a>
    <a class="entry" href="calendar.html">
      <span class="n">Calendar</span>
      <span class="g">printable, by month</span>
    </a>
  </div>

</div>

<div class="foot" id="foot">&mdash;</div>

<script>
"use strict";
/* ── departure sequence ────────────────────────────────
   held breath → the word wakes → the drain → gone      */
var LEAVING=false;
function depart(door){
  if(LEAVING)return; LEAVING=true;
  var dest=door.dataset.go, body=document.body;

  // clone the word into a fixed overlay, pinned exactly where it sits
  var r=door.getBoundingClientRect();
  var cs=getComputedStyle(door);
  var g=document.createElement("span");
  g.id="ghost";
  g.textContent=door.textContent;
  g.style.left=r.left+"px";
  g.style.top=r.top+"px";
  g.style.fontSize=cs.fontSize;
  g.style.lineHeight=cs.lineHeight;
  g.style.letterSpacing=cs.letterSpacing;
  document.body.appendChild(g);

  door.classList.add("chosen");
  var line=door.closest(".cl"); if(line)line.classList.add("chosen");

  // beat 1 — held breath
  setTimeout(function(){
    body.classList.add("leaving");
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        g.classList.add("on");                       // the word wakes on its own layer
        setTimeout(function(){ g.classList.add("glow"); },160);
      });
    });

    // beat 2 — everything else drains away beneath it
    setTimeout(function(){ body.classList.add("drain"); }, 400);

    // beat 3 — the word withdraws
    setTimeout(function(){ g.classList.add("out"); }, 1350);

    setTimeout(function(){ location.href = dest; }, 1920);
  }, 420);
}

document.querySelectorAll(".door").forEach(function(d){
  d.addEventListener("click",function(e){ e.preventDefault(); depart(d); });
});

/* the revealed list departs the same way, without the word ceremony */
document.querySelectorAll(".entry").forEach(function(a){
  a.addEventListener("click",function(e){
    if(LEAVING){e.preventDefault();return}
    e.preventDefault(); LEAVING=true;
    var dest=a.getAttribute("href");
    document.body.classList.add("leaving");
    setTimeout(function(){document.body.classList.add("drain")},60);
    setTimeout(function(){location.href=dest},900);
  });
});

/* returning to this page from cache should not show a drained screen */
window.addEventListener("pageshow",function(e){
  if(e.persisted){
    LEAVING=false;
    document.body.classList.remove("leaving","woken","drain","vanish");
    document.querySelectorAll(".chosen").forEach(function(el){el.classList.remove("chosen")});
    var g=document.getElementById("ghost"); if(g)g.remove();
  }
});

var seam = document.getElementById("seam");
seam.addEventListener("click", function(){
  document.body.classList.toggle("open");
});

// quiet date at the foot
(function(){
  var d = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("foot").textContent =
    days[d.getDay()] + " \u00b7 " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
})();
</script>
</body>
</html>
