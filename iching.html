// table is static HTML

function show(n,keepLine){
  const d=H[n];
  if(!d)return;
  curHex=n;
  if(!keepLine)changingLine=null;
  const tri=TRI[n];
  const lower=T[tri[0]];
  const upper=T[tri[1]];
  const L=hexLines(n);

  // visual hexagram — drawn top (line 6) to bottom (line 1), each tappable
  let visual='';
  for(let p=6;p>=1;p--){
    const yang=L[p-1]===1;
    const isCh=changingLine===p;
    const bar=yang?'<div class="bar yang"><span class="seg"></span></div>'
                  :'<div class="bar yin"><span class="seg"></span><span class="seg"></span></div>';
    const mark=isCh?(yang?'○':'✕'):'';
    visual+=`<div class="hexline ${isCh?'changing':''}" onclick="pickLine(${p})">
      <span class="pos">Line ${p}</span>${bar}<span class="mark">${mark}</span></div>`;
  }

  // transformation panel (only when a line is selected)
  let transform='';
  if(changingLine){
    const rn=changingHex(n,changingLine);
    const rd=H[rn];
    transform=`<div class="transform">
      <div class="transform-flow">
        <div class="tf-hex"><span class="tf-sym">${s(n)}</span><div class="tf-meta"><span class="tf-num">Hexagram ${n}</span><span class="tf-name">${d.name}</span></div></div>
        <span class="tf-arrow">→</span>
        <button class="tf-link tf-hex" onclick="show(${rn})"><span class="tf-sym">${s(rn)}</span><div class="tf-meta"><span class="tf-num">Hexagram ${rn}</span><span class="tf-name">${rd.name}</span></div></button>
      </div>
      <div class="transform-note"><strong>Line ${changingLine} is changing.</strong> Read this line's text below as the heart of the reading. The situation moves from <em>${d.name}</em> toward <em>${rd.name}</em> — that is the direction of change.</div>
      <button class="clear-changing" onclick="show(${n})">clear changing line</button>
    </div>`;
  }

  // line texts — emphasize selected, dim others
  const lineTexts=d.lines.map((t,i)=>{
    const p=i+1;
    let cls='line-block';
    if(changingLine){cls+=(changingLine===p)?' active-line':' dimmed';}
    return `<div class="${cls}"><div class="line-n">Line ${p} · from the bottom</div><div class="line-t">${t}</div></div>`;
  }).join('');

  // ADVANCED layer
  const nuc=nuclearHex(n), opp=oppositeHex(n), rev=reversedHex(n);
  const posRows=LINEPOS.map((txt,i)=>`<div class="pos-row ${i===4?'ruler':''}"><span class="pos-n">Line ${i+1}</span><span class="pos-d">${txt}</span></div>`).join('');
  const advanced=`
    <div class="d-section adv-section ${advanceMode?'show':''}" id="advSection">
      <div class="d-label">Structure</div>
      <div class="struct-grid">
        <button class="struct-cell tf-link" onclick="show(${nuc})"><div class="struct-label">Nuclear · Hu Gua</div><div class="struct-sym">${s(nuc)}</div><div class="struct-name">${H[nuc].name}</div><div class="struct-num">Hexagram ${nuc}</div></button>
        <button class="struct-cell tf-link" onclick="show(${opp})"><div class="struct-label">Opposite · Cuo</div><div class="struct-sym">${s(opp)}</div><div class="struct-name">${H[opp].name}</div><div class="struct-num">Hexagram ${opp}</div></button>
        <button class="struct-cell tf-link" onclick="show(${rev})"><div class="struct-label">Reversed · Zong</div><div class="struct-sym">${s(rev)}</div><div class="struct-name">${H[rev].name}</div><div class="struct-num">Hexagram ${rev}</div></button>
      </div>
      <div class="struct-desc"><strong>Nuclear (Hu Gua):</strong> the hidden hexagram inside this one (lines 2-3-4 and 3-4-5) — the seed situation developing beneath the surface. <strong>Opposite (Cuo):</strong> every line inverted — the complementary state. <strong>Reversed (Zong):</strong> the hexagram turned upside down — the same situation seen from the other side.</div>
      <div class="d-label" style="margin-top:18px">Line positions</div>
      <div class="pos-ref">${posRows}</div>
      <div class="struct-desc">★ Line 5 is most commonly the <strong>ruling line</strong> — though which line rules depends on the hexagram and the commentary tradition.</div>
    </div>`;

  document.getElementById('detailView').innerHTML=`
    <div class="d-header">
      <div class="d-sym">${s(n)}</div>
      <div class="d-num">Hexagram ${n}</div>
      <div class="d-name">${d.name}</div>
      <div class="d-pinyin">${HZ[n]} · ${d.py}</div>
      <div class="d-trigrams">
        <span class="tri-tag">Upper: ${upper[1]} ${upper[0]}</span>
        <span class="tri-tag">Lower: ${lower[1]} ${lower[0]}</span>
      </div>
      <button class="advance-toggle ${advanceMode?'on':''}" onclick="toggleAdvance()"><span class="dot"></span>${advanceMode?'Advanced view on':'Advanced view'}</button>
    </div>
    <div class="d-section">
      <div class="d-label">Situation</div>
      <div class="d-text">${d.sit}</div>
    </div>
    <div class="d-section">
      <div class="d-label">Lines</div>
      <div class="lines-hint">Tap a line to mark it as the changing line.</div>
      <div class="hexlines">${visual}</div>
      ${transform}
    </div>
    <div class="d-section">
      <div class="d-label">Line texts${changingLine?' · changing line highlighted':''}</div>
      ${lineTexts}
    </div>
    ${advanced}`;
  document.getElementById('detailView').classList.add('active');
  document.getElementById('tableView').style.display='none';
  document.getElementById('backBtn').classList.add('active');
  window.scrollTo(0,0);
}

function pickLine(p){
  changingLine=(changingLine===p)?null:p;
  show(curHex,true);
}
function toggleAdvance(){
  advanceMode=!advanceMode;
  show(curHex,true);
}

function showTable(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('tableView').style.display='block';
  document.getElementById('backBtn').classList.remove('active');
}

function showTri(key){
  const d=TR[key];
  if(!d)return;
  const attrs=d.attrs.map(a=>`<div class="line-block"><div class="line-t">${a}</div></div>`).join('');
  document.getElementById('detailView').innerHTML=`
    <div class="d-header">
      <div class="d-sym">${d.sym}</div>
      <div class="d-num">Trigram</div>
      <div class="d-name">${d.name}</div>
      <div class="d-pinyin">${d.hz} · ${d.py}</div>
    </div>
    <div class="d-section">
      <div class="d-label">Nature</div>
      <div class="d-text">${d.nature}</div>
    </div>
    <div class="d-section">
      <div class="d-label">As lower trigram — internal state</div>
      <div class="d-text">${d.lower}</div>
    </div>
    <div class="d-section">
      <div class="d-label">As upper trigram — external situation</div>
      <div class="d-text">${d.upper}</div>
    </div>
    <div class="d-section">
      <div class="d-label">Attributes</div>
      ${attrs}
    </div>`;
  document.getElementById('detailView').classList.add('active');
  document.getElementById('tableView').style.display='none';
  document.getElementById('backBtn').classList.add('active');
  window.scrollTo(0,0);
}
